name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.1.2
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      - name: Type check
        run: pnpm run typecheck
      - name: Run tests
        run: pnpm run test
