name: Linting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.1.2
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      - name: Run lint and format checks
        run: pnpm run lint:ci

      - name: Install GitHub Actions lockfile verifier
        run: gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION"
        env:
          # renovate: datasource=github-releases depName=github/gh-actions-lock
          GH_ACTIONS_LOCK_VERSION: v0.5.1
          GH_TOKEN: ${{ github.token }}

      - name: Verify GitHub Actions lockfile
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
