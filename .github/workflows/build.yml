name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  build:
    name: Build [rolldown]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.1.2
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      - name: Build library
        run: pnpm run build
