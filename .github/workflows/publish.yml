name: Publish

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm OIDC trusted publishing + provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.1.2
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      - name: Type check
        run: pnpm run typecheck
      - name: Run tests
        run: pnpm run test
      - name: Build library
        run: pnpm run build
      - name: Publish to npm
        # Auth + provenance via OIDC trusted publishing (no NPM_TOKEN needed).
        # Requires the npm package to trust the entry-point workflow (release.yml).
        run: pnpm publish --provenance --access public --no-git-checks
